services:
  backend:
    build:
      context: ../coordenando back e front/backend
      dockerfile: Dockerfile
    container_name: backend
    expose:
      - "4000"
    networks:
      - rede-compose

  frontend:
    build:
      context: ../coordenando back e front/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - rede-compose
    depends_on:
      - backend

networks:
  rede-compose:
    driver: bridge