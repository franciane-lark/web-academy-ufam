<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lembretes com TypeScript Tuplas</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; position: relative; }
        .danger { color: red; cursor: pointer; float: right; }
        .edit { color: blue; cursor: pointer; float: right; margin-right: 15px; }
        .hidden { display: none; }
        form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        input, textarea, button { padding: 8px; }
    </style>
</head>
<body>

    <h2>App Lembretes (TypeScript Tuplas)</h2>

    <div id="secao-login">
        <h3>🔒 Autenticação</h3>
        <form id="form-login">
            <input type="text" id="usuario" placeholder="Usuário (use: admin)" required>
            <input type="password" id="senha" placeholder="Senha (use: 123)" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <div id="secao-app" class="hidden">
        <p>Bem-vindo, <strong id="nome-usuario"></strong>! <button id="btn-sair">Sair</button></p>
        
        <h3>Novo Lembrete</h3>
        <form id="form-lembrete">
            <input type="text" id="titulo" placeholder="Título da Atividade" required>
            <input type="date" id="data-limite">
            <textarea id="descricao" placeholder="Descrição (opcional)"></textarea>
            <button type="submit">Salvar Lembrete</button>
        </form>

        <h3>Meus Lembretes</h3>
        <div id="lista-lembretes"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
